<g><rect x="319" y="88" width="270" height="130" rx="15" fill="#0d1527" stroke="#4c3d72"/><circle cx="353" cy="122" r="18" fill="#a78bfa" fill-opacity=".13" stroke="#a78bfa"/><text x="353" y="128" text-anchor="middle" class="b" font-size="18" font-weight="800" fill="#c4b5fd">WS</text><text x="382" y="119" class="b" font-size="18" font-weight="800" fill="#f8fafc">Real-time flows</text><text x="341" y="159" class="b" font-size="14" fill="#94a3b8">Channels · WebSockets</text><text x="341" y="184" class="b" font-size="14" fill="#94a3b8">Async state synchronization</text></g>
<g><rect x="610" y="88" width="270" height="130" rx="15" fill="#0d1527" stroke="#245365"/><circle cx="644" cy="122" r="18" fill="#60a5fa" fill-opacity=".13" stroke="#60a5fa"/><text x="644" y="128" text-anchor="middle" class="b" font-size="18" font-weight="800" fill="#93c5fd">⚡</text><text x="673" y="119" class="b" font-size="18" font-weight="800" fill="#f8fafc">Performance</text><text x="632" y="159" class="b" font-size="14" fill="#94a3b8">Redis · caching strategy</text><text x="632" y="184" class="b" font-size="14" fill="#94a3b8">ORM and query optimization</text></g>
