<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Engineering proof</title><desc id="desc">Four recruiter-focused engineering capability cards.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d18"/><stop offset="1" stop-color="#11152b"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<style>.b{font-family:Arial,Helvetica,sans-serif}</style>
<rect x="1" y="1" width="1198" height="248" rx="22" fill="url(#bg)" stroke="#273652"/><rect x="27" y="24" width="112" height="4" rx="2" fill="url(#a)"/>
<text x="28" y="61" class="b" font-size="25" font-weight="800" fill="#f8fafc">Engineering proof</text><text x="1172" y="57" text-anchor="end" class="b" font-size="13" fill="#7f91aa">what recruiters can verify in the repositories</text>
