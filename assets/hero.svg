<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Adarsh DN Pathak — Backend and Real-Time Systems Engineer</title>
<desc id="desc">Animated dark portfolio banner with cyan and violet accents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset=".52" stop-color="#0d1630"/><stop offset="1" stop-color="#11102a"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#93c5fd" stroke-opacity=".075"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="soft"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".38"/></filter>
</defs>
<style>
  .base{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}
  .pulse{animation:pulse 4s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}.dash{stroke-dasharray:10 14;animation:dash 18s linear infinite}
  .role1,.role2,.role3{opacity:0;animation:roles 9s ease-in-out infinite}.role2{animation-delay:3s}.role3{animation-delay:6s}
  .cursor{animation:blink 1s steps(2,end) infinite}.spark{animation:spark 3s ease-in-out infinite}.s2{animation-delay:1.1s}.s3{animation-delay:2s}
  @keyframes pulse{50%{opacity:.45;transform:scale(1.05)}}@keyframes float{50%{transform:translateY(-10px)}}
  @keyframes dash{to{stroke-dashoffset:-480}}@keyframes roles{0%,5%{opacity:0;transform:translateY(8px)}10%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-8px)}}
  @keyframes blink{50%{opacity:0}}@keyframes spark{50%{opacity:.25;transform:scale(.65)}}
</style>
<rect width="1200" height="410" rx="28" fill="url(#bg)"/>
<rect width="1200" height="410" rx="28" fill="url(#grid)"/>
<circle cx="150" cy="80" r="170" fill="url(#glow)" filter="url(#blur)" class="pulse"/>
<circle cx="1080" cy="330" r="180" fill="#8b5cf6" opacity=".10" filter="url(#blur)" class="pulse"/>
<path d="M48 330C230 250 333 375 520 282S847 180 1150 259" fill="none" stroke="url(#accent)" stroke-opacity=".28" stroke-width="2" class="dash"/>
<g class="float" filter="url(#soft)">
  <rect x="62" y="54" width="434" height="302" rx="18" fill="#0b1224" stroke="#3b82f6" stroke-opacity=".30"/>
  <rect x="62" y="54" width="434" height="42" rx="18" fill="#121c34"/><path d="M62 78h434v18H62z" fill="#121c34"/>
  <circle cx="88" cy="76" r="6" fill="#fb7185"/><circle cx="110" cy="76" r="6" fill="#fbbf24"/><circle cx="132" cy="76" r="6" fill="#4ade80"/>
  <text x="164" y="82" class="mono" font-size="14" fill="#8da2c0">adarsh@backend:~/portfolio</text>
  <text x="90" y="132" class="mono" font-size="17" fill="#67e8f9">$ whoami</text>
  <text x="90" y="164" class="mono" font-size="16" fill="#e2e8f0">Backend engineer in the making</text>
  <text x="90" y="205" class="mono" font-size="17" fill="#a78bfa">$ stack --focus</text>
  <text x="90" y="237" class="mono" font-size="16" fill="#e2e8f0">Django · REST · WebSockets</text>
  <text x="90" y="265" class="mono" font-size="16" fill="#e2e8f0">PostgreSQL · Redis · AI</text>
  <text x="90" y="306" class="mono" font-size="17" fill="#4ade80">$ build --ship --learn</text>
  <rect x="326" y="291" width="10" height="20" rx="2" fill="#4ade80" class="cursor"/>
</g>
<g class="base">
  <circle cx="1120" cy="70" r="5" fill="#67e8f9" class="spark"/><circle cx="1042" cy="108" r="4" fill="#a78bfa" class="spark s2"/><circle cx="1160" cy="175" r="4" fill="#60a5fa" class="spark s3"/>
  <text x="555" y="105" font-size="18" letter-spacing="4" fill="#67e8f9" font-weight="700">HELLO, I'M</text>
  <text x="552" y="174" font-size="57" fill="#f8fafc" font-weight="800">ADARSH DN PATHAK</text>
  <rect x="555" y="194" width="500" height="3" rx="2" fill="url(#accent)"/>
  <g font-size="24" font-weight="600">
    <text x="555" y="245" fill="#cbd5e1" class="role1">Backend Developer · API Architect</text>
    <text x="555" y="245" fill="#cbd5e1" class="role2">Real-Time Systems · WebSockets</text>
    <text x="555" y="245" fill="#cbd5e1" class="role3">AI-Enabled Products · Cloud</text>
  </g>
  <g font-size="14" font-weight="700" letter-spacing="1">
    <rect x="555" y="281" width="112" height="34" rx="8" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><text x="578" y="303" fill="#67e8f9">PYTHON</text>
    <rect x="679" y="281" width="112" height="34" rx="8" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".45"/><text x="700" y="303" fill="#93c5fd">DJANGO</text>
    <rect x="803" y="281" width="140" height="34" rx="8" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".45"/><text x="824" y="303" fill="#c4b5fd">REAL-TIME</text>
    <rect x="955" y="281" width="80" height="34" rx="8" fill="#4ade80" fill-opacity=".10" stroke="#4ade80" stroke-opacity=".40"/><text x="981" y="303" fill="#86efac">AI</text>
  </g>
  <text x="555" y="345" font-size="17" fill="#94a3b8">Building reliable systems from Varanasi, India.</text>
</g>
</svg>